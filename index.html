<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230b6e72' stroke-width='2' stroke-linecap='round'%3E%3Crect width='18' height='18' x='3' y='4' rx='2'/%3E%3Cpath d='M16 2v4M8 2v4M3 10h18'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Everything is local: the only outside request is the calendar data -->
<link rel="stylesheet" href="css/flags.css">
<link rel="stylesheet" href="css/app.css">
<script>
  // Theme before first paint (login page included): Dark unless the person chose Light
  // or "Match my computer" in Settings → Display. No data-theme = follow the system.
  try {
    const t = (JSON.parse(localStorage.getItem("econocal:prefs") || "{}") || {}).theme || "dark";
    if (t !== "system") document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
  } catch { document.documentElement.dataset.theme = "dark"; }
</script>
</head>
<body>
<main id="login" class="login" hidden>
  <form id="loginForm" class="login-card" novalidate>
    <h1>Prototype Portal</h1>
    <p class="login-sub">Enter the password you were given.</p>
    <!-- Hidden username lets password managers save the demo password -->
    <input type="text" name="username" value="demo" autocomplete="username" hidden>
    <label class="field">
      <span class="field-label">Password</span>
      <input type="password" id="password" autocomplete="current-password" required aria-describedby="loginError">
    </label>
    <label class="check"><input type="checkbox" id="showPassword"> Show password</label>
    <p class="form-err" id="loginError" role="alert"></p>
    <button type="submit" class="btn primary login-btn">Log in</button>
  </form>
</main>

<div class="wrap" id="app" hidden>
  <div class="userbar">
    <!-- Testing only: which connection the calendar data comes from -->
    <div class="conn-toggle" id="connToggle" role="radiogroup" aria-label="Data connection (testing)" title="Data connection, for testing">
      <button type="button" role="radio" data-conn="finnhub" aria-checked="true">Finnhub</button><button type="button" role="radio" data-conn="motivewave" aria-checked="false">MotiveWave</button>
    </div>
    <button type="button" class="linkbtn" id="logout">Log out</button>
  </div>
  <header class="top">
    <h1>Economic Calendar</h1>
    <div class="top-acts">
      <label class="tz-pick" id="tzPick" title="Time zone for event times"><select id="tz" aria-label="Time zone"></select></label>
      <span class="top-sep" aria-hidden="true">|</span>
      <button type="button" id="gear" class="head-icon" aria-label="Settings: country groups and alerts" title="Settings" aria-expanded="false" aria-controls="settings">
        <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </header>

  <!-- .topbar only matters on phones (sticky bar); on desktop it's display: contents -->
  <div class="topbar" id="topbar">
    <!-- Week bar: ‹ previous week, the day tabs, › next week -->
    <div class="weekbar">
      <button type="button" id="prevWeek" class="tb-arrow" aria-label="Previous week" title="Previous week"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="daytabs" id="daytabs" role="group" aria-label="Day" hidden></div>
      <button type="button" id="nextWeek" class="tb-arrow" aria-label="Next week" title="Next week"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>

  <div class="statusbar">
    <div class="count sr" id="count" aria-live="polite"></div><!-- hidden; still announces result counts to screen readers -->
    <!-- Filters as plain text dropdowns, then Reset filters; warnings, search and refresh at the right -->
    <div class="sb-filters">
      <label class="sb-pick" id="countryPick" title="Countries"><span class="sb-label">Countries</span><select id="countryPreset" aria-label="Countries"></select></label>
      <div id="ddImpact"></div>
      <div id="ddTypes"></div>
    </div>
    <div class="active" id="active"></div>
    <span id="source" class="source"></span>
    <!-- This Week, Search and Refresh at the right end of the filter line, above the table -->
    <button type="button" id="thisWeek" class="tb-btn sb-thisweek" title="Back to this week">This Week</button>
    <div class="search">
      <svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="q" placeholder="Search events" aria-label="Search events by name" autocomplete="off">
      <button type="button" id="qClear" class="icon-btn sm" aria-label="Clear search" title="Clear search" hidden>
        <svg class="ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <button type="button" id="refreshBtn" class="head-icon" aria-label="Refresh" title="Refresh"><svg class="ico" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
  </div>

  <div class="sr" id="announce" aria-live="assertive"></div>

  <div class="tablebox">
    <table>
      <colgroup>
        <col class="w-time"><col class="w-imp"><col class="w-ctry"><col class="w-ev">
        <col class="w-num"><col class="w-num"><col class="w-num"><col class="w-alert">
      </colgroup>
      <thead><tr>
        <th scope="col" id="thTime">Time</th>
        <th scope="col">Impact</th>
        <th scope="col">Country</th>
        <th scope="col">Event</th>
        <th scope="col" class="num">Actual</th>
        <th scope="col" class="num">Forecast</th>
        <th scope="col" class="num">Previous</th>
        <th scope="col" class="c-alert">Alert</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<dialog id="settings" class="modal settings-modal"></dialog>
<dialog id="alarmDialog" class="modal alarm-modal"></dialog>
<dialog id="countryDialog" class="modal country-modal"></dialog>

<!-- Classic scripts, loaded in dependency order (no build step) -->
<!-- Data -->
<script src="js/data/credentials.js"></script>
<script src="js/data/country-groups.js"></script>
<!-- Core logic (no DOM) -->
<script src="js/core/store.js"></script>
<script src="js/core/colors.js"></script>
<script src="js/core/countries.js"></script>
<script src="js/core/groups.js"></script>
<script src="js/core/time.js"></script>
<script src="js/core/directions.js"></script>
<script src="js/core/events.js"></script>
<script src="js/core/filters.js"></script>
<script src="js/core/alerts.js"></script>
<!-- Services -->
<script src="js/services/vault.js"></script>
<script src="js/services/finnhub.js"></script>
<script src="js/services/motivewave.js"></script>
<!-- UI components -->
<script src="js/ui/html.js"></script>
<script src="js/ui/icons.js"></script>
<script src="js/ui/multiselect.js"></script>
<script src="js/ui/country-tree.js"></script>
<script src="js/ui/country-picker.js"></script>
<script src="js/ui/confirm.js"></script>
<script src="js/ui/settings.js"></script>
<script src="js/ui/table.js"></script>
<script src="js/ui/alarm.js"></script>
<!-- Entry points: app wiring, then the login gate that starts it -->
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
